name: go
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -covermode=atomic ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --build-tags e2e

  e2e:
    needs: [test, lint]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: petfinder_e2e
          POSTGRES_USER: petfinder
          POSTGRES_PASSWORD: petfinder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petfinder -d petfinder_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://petfinder:petfinder@localhost:5432/petfinder_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make migrate-up DATABASE_URL="$E2E_DATABASE_URL"
      - run: go test -tags e2e -race -count=1 ./e2e/...

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make docs-generate docs-check docs-validate

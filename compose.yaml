name: petfinder

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-petfinder}
      POSTGRES_USER: ${POSTGRES_USER:-petfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petfinder}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-petfinder}:${POSTGRES_PASSWORD:-petfinder}@db:5432/${POSTGRES_DB:-petfinder}?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-petfinder}:${POSTGRES_PASSWORD:-petfinder}@db:5432/${POSTGRES_DB:-petfinder}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-petfinder-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-petfinder}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
